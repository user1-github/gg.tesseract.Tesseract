id: gg.tesseract.Tesseract
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: tesseract
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --persist=.tesseract
modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_mixer.json

  - name: enet
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
      - '*.a'
    sources:
      - type: archive
        url: http://enet.bespin.org/download/enet-1.3.18.tar.gz
        sha256: 2a8a0c5360d68bb4fcd11f2e4c47c69976e8d2c85b109dd7d60b1181a4f85d36

  - name: tesseract
    buildsystem: cmake-ninja
    no-make-install: true
    subdir: src
    sources:
      - type: git
        url: https://github.com/user1-github/tesseract.git
        commit: 88c28d45ab7019e5c00f04456239845f900f46ec
      - type: file
        path: tesseract.sh
      - type: file
        path: gg.tesseract.Tesseract.desktop
    post-install:
      - mkdir -p /app/share/tesseract
      - cp -a ../config ../media /app/share/tesseract
      - install -Dm755 tesseract_linux -t /app/bin
      - install -Dm755 ../tesseract.sh /app/bin/tesseract
      - install -Dm644 ../media/interface/cube.png /app/share/icons/hicolor/256x256/apps/gg.tesseract.Tesseract.png
      - install -Dm644 ../gg.tesseract.Tesseract.desktop -t /app/share/applications
